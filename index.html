
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClipGenius AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090d18;color:white;font-family:Arial,sans-serif}
header{padding:22px 7%;border-bottom:1px solid #30364a}
.logo{font-size:25px;font-weight:bold;color:#a48aff}
.hero{text-align:center;padding:65px 20px 35px}
h1{font-size:38px}
.highlight{color:#a48aff}
p{color:#b2bad0;line-height:1.6}
.container{max-width:700px;margin:25px auto;padding:25px;background:#151c2d;border:1px solid #303b54;border-radius:18px}
.upload{display:block;border:2px dashed #8170d9;padding:40px 15px;text-align:center;border-radius:14px;cursor:pointer}
button{background:#8164ed;color:white;border:0;padding:13px 22px;border-radius:9px;font-size:16px}
input{display:none}
video{width:100%;margin-top:20px;border-radius:12px}
footer{text-align:center;padding:35px;color:#8490a8}
</style>
</head>
<body>
<header><div class="logo">✦ ClipGenius AI</div></header>
<section class="hero">
<h1>Turn Long Videos Into <span class="highlight">Short Clips</span></h1>
<p>Create content for YouTube Shorts, Instagram Reels and more.</p>
</section>
<div class="container">
<h2>Upload Your Video</h2>
<p>Select a video from your device to preview it.</p>
<label class="upload" for="videoFile">
<div style="font-size:40px">⬆</div>
<h3>Choose Your Video</h3>
<p>Tap here to select a video</p>
<button type="button">Select Video</button>
</label>
<input type="file" id="videoFile" accept="video/*">
<video id="preview" controls hidden></video>
<p id="details"></p>
<p>Automatic AI clipping and video export will be added in future updates.</p>
</div>
<footer>© 2026 ClipGenius AI · Built for Creators</footer>
<script>
const input=document.getElementById("videoFile");
const preview=document.getElementById("preview");
const details=document.getElementById("details");
let currentURL=null;
input.addEventListener("change",()=>{
const file=input.files[0];
if(!file)return;
if(currentURL)URL.revokeObjectURL(currentURL);
currentURL=URL.createObjectURL(file);
preview.src=currentURL;
preview.hidden=false;
details.textContent="Selected: "+file.name;
});
</script>
</body>
  </html>
